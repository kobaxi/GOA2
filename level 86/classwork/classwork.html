<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="h1_1">Click button to see result</h1>
    <button id="but_1">Click Me</button>

    <script>
        let h1 = document.getElementById("h1_1");
        let button = document.getElementById("but_1");

        button.addEventListener("click", function() {
            h1.textContent = "Hello World!";
        });
    </script>

</body>
</html>
