<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
        <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:#111827;
    position:sticky;
    top:0;
}

header h1{
    color:#38bdf8;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
    transition:.3s;
}

nav a:hover{
    color:#38bdf8;
}

.hero{
    text-align:center;
    padding:100px 20px;
}

.hero h2{
    font-size:50px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
}

.hero button{
    padding:15px 40px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.hero button:hover{
    transform:scale(1.1);
    background:#0ea5e9;
}

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
    padding:50px;
}

.card{
    width:260px;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
    transition:.3s;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.card:hover{
    transform:translateY(-10px);
}

.card h3{
    color:#38bdf8;
    margin-bottom:15px;
}

.games{
    text-align:center;
    padding:50px;
}

.games h2{
    margin-bottom:20px;
}

#search{
    width:300px;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:40px;
    font-size:16px;
}

.contact{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:50px;
}

.contact h2{
    margin-bottom:30px;
}

form{
    width:400px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,
textarea{
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0ea5e9;
}

footer{
    text-align:center;
    padding:20px;
    background:#111827;
    margin-top:50px;
}

@media(max-width:768px){

header{
    flex-direction:column;
}

nav{
    margin-top:15px;
}

.hero h2{
    font-size:35px;
}

form{
    width:90%;
}

.cards{
    flex-direction:column;
    align-items:center;
}

}
    </style>
</head>
<body>

<header>
    <h1>Game World</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="games">

    <h2>Our Games</h2>

    <input type="text" id="search" placeholder="Search games..." onkeyup="searchGame()">

    <div class="cards" id="gameList">

        <div class="card">
            <h3>Minecraft</h3>
            <p>Sandbox Adventure Game</p>
        </div>

        <div class="card">
            <h3>Roblox</h3>
            <p>Create and Play Games</p>
        </div>

        <div class="card">
            <h3>Fortnite</h3>
            <p>Battle Royale</p>
        </div>

        <div class="card">
            <h3>Valorant</h3>
            <p>FPS Shooter</p>
        </div>

        <div class="card">
            <h3>GTA V</h3>
            <p>Open World</p>
        </div>

        <div class="card">
            <h3>Rocket League</h3>
            <p>Cars + Football</p>
        </div>

    </div>

</section>

<footer>
    <p> 2026 Game World</p>
</footer>

<script>
function welcome() {
    alert("Welcome to Game World! ");
}

function searchGame() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll("#gameList .card");

    cards.forEach(function(card) {
        let title = card.querySelector("h3").textContent.toLowerCase();

        if (title.includes(input)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}

function sendMessage() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    if (name === "" || email === "" || message === "") {
        alert("Please fill in all fields.");
        return false;
    }

    alert("Your message has been sent successfully!");

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("message").value = "";

    return false;
}
</script>

</body>
</html>
